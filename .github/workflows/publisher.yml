# Herkos publisher cadence.
#
# Event-driven with a heartbeat floor, NOT a fixed 15-minute attestation loop. The
# distinction is a cost decision measured in Architecture1.md: an FDC attestation is
# 20 FLR on mainnet, so a 15-minute heartbeat is ~96 requests/day ≈ 1,920 FLR ≈ $11.74/day
# for no new information. The publisher therefore *checks* often and *attests* rarely —
# only when divergence crosses the governance threshold in the direction that lowers
# capacity. A run that attests nothing is the normal, correct outcome.
#
# Cadence lives here rather than in a resident process because Render's free tier has no
# cron and no background worker. GitHub Actions gives the schedule for free.
#
# This workflow never touches Flare mainnet. It runs the dry-run publisher against a
# throwaway anvil fork; PUBLISH stays false and no funded key exists in this repo.

name: publisher

on:
  schedule:
    # Every 30 minutes — the *check* cadence. Attestation is gated on divergence, so
    # this costs nothing but an eth_call sweep. Offset off the hour: every scheduler on
    # the planet fires at :00, and GitHub delays the stampede.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Submit for real (requires a funded key — false in this repo)'
        type: boolean
        default: false

concurrency:
  # A slow run must not overlap the next tick and double-submit the same proof.
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache key and no `npm ci`: there is no lockfile and no node_modules,
          # ever. Nothing in this repo imports a package.

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Read the pinned fork block
        id: pin
        run: echo "block=$(node -p "require('./fork.json').forkBlock")" >> "$GITHUB_OUTPUT"

      - name: Boot the fork
        run: |
          anvil --fork-url https://flare-api.flare.network/ext/C/rpc \
                --fork-block-number ${{ steps.pin.outputs.block }} \
                --port 8545 --no-rate-limit --silent &
          # --no-rate-limit is required: a poke() is hundreds of state fetches and the
          # public RPC otherwise rate-limits the queue walk into transport failures.
          for i in $(seq 1 60); do
            cast block-number --rpc-url http://localhost:8545 >/dev/null 2>&1 && break
            sleep 2
          done
          cast block-number --rpc-url http://localhost:8545

      - name: Readers
        run: npm run phase1

      - name: Publisher
        env:
          # Dry-run unless a human dispatched it AND a funded key exists. Neither is
          # true in this repo, which is the point: $0, and no key to leak.
          PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: npm run publisher

      - name: Upload the provenance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-${{ github.run_number }}
          path: |
            phase3-results.json
            readers.json
          retention-days: 14
          if-no-files-found: warn
